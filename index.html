<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RavoX AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0f12;
    --panel: #12161b;
    --panel-2: #171c22;
    --line: #232a32;
    --text: #dfe6ec;
    --text-dim: #7c8892;
    --amber: #e8a355;
    --amber-dim: #7a5c33;
    --green: #4caf7d;
    --red: #d16b6b;
    --radius: 3px;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }
  body {
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .brand {
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--text);
    white-space: nowrap;
  }
  .brand span { color: var(--amber); }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .status-dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.err { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .status-text {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }
  button.ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    margin-left: auto;
  }
  button.ghost:hover { border-color: var(--amber-dim); color: var(--text); }

  /* Chat area */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 28px 0 140px;
  }
  .thread {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 22px;
  }
  .msg {
    margin-bottom: 26px;
    padding-left: 14px;
    border-left: 2px solid var(--line);
  }
  .msg.user { border-left-color: var(--amber-dim); }
  .msg.assistant { border-left-color: var(--green); opacity: 0.97; }
  .msg-role {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: lowercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .msg.user .msg-role { color: var(--amber); }
  .msg.assistant .msg-role { color: var(--green); }
  .msg-body {
    font-size: 14.5px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg-body code {
    font-family: var(--mono);
    background: var(--panel-2);
    padding: 1px 5px;
    border-radius: 2px;
    font-size: 0.9em;
  }
  .msg-body pre {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    overflow-x: auto;
  }
  .msg-body pre code { background: none; padding: 0; }
  .empty-state {
    max-width: 760px;
    margin: 60px auto;
    padding: 0 22px;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.8;
  }
  .empty-state .big {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 22px;
    color: var(--text);
    margin-bottom: 10px;
  }

  /* Input bar */
  .composer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, transparent, var(--bg) 30%);
    padding: 26px 22px 22px;
  }
  .composer-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 10px 10px 16px;
  }
  .composer-inner:focus-within { border-color: var(--amber-dim); }
  #promptInput {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14.5px;
    resize: none;
    max-height: 200px;
    line-height: 1.5;
    padding: 6px 0;
  }
  #sendBtn {
    background: var(--amber);
    color: #1a1204;
    border: none;
    font-family: var(--mono);
    font-weight: 600;
    font-size: 12.5px;
    padding: 10px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    flex-shrink: 0;
  }
  #sendBtn:disabled { background: var(--panel-2); color: var(--text-dim); cursor: default; }
  #sendBtn:hover:not(:disabled) { filter: brightness(1.08); }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<header>
  <div class="brand">RavoX<span> AI</span></div>
  <div class="status-dot" id="statusDot"></div>
  <div class="status-text" id="statusText">bağlanıyor...</div>
  <button class="ghost" id="clearBtn">temizle</button>
</header>

<main id="main">
  <div class="empty-state" id="emptyState">
    <div class="big">RavoX AI</div>
    Bir şey sor, hemen başlayalım.
  </div>
  <div class="thread" id="thread"></div>
</main>

<div class="composer">
  <div class="composer-inner">
    <textarea id="promptInput" rows="1" placeholder="Bir şey sor..."></textarea>
    <button id="sendBtn">gönder</button>
  </div>
</div>

<script>
const SERVER = 'https://water-soon-ride-year.trycloudflare.com';

const $ = (id) => document.getElementById(id);
const clearBtn = $('clearBtn');
const statusDot = $('statusDot');
const statusText = $('statusText');
const thread = $('thread');
const emptyState = $('emptyState');
const promptInput = $('promptInput');
const sendBtn = $('sendBtn');
const main = $('main');

let history = [];
let connected = false;
let activeModel = '';

function setStatus(state, text) {
  statusDot.className = 'status-dot' + (state ? ' ' + state : '');
  statusText.textContent = text;
}

async function connect() {
  setStatus('', 'bağlanıyor...');
  try {
    const res = await fetch(SERVER + '/api/tags');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const models = (data.models || []).map(m => m.name);
    if (models.length === 0) {
      connected = false;
      setStatus('err', 'model bulunamadı');
      return;
    }
    activeModel = models[0];
    connected = true;
    setStatus('ok', activeModel);
  } catch (err) {
    connected = false;
    setStatus('err', 'bağlantı yok');
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function renderBody(text) {
  // minimal ```code``` block support
  const parts = text.split(/```/);
  let html = '';
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      html += '<pre><code>' + escapeHtml(part.replace(/^\w*\n/, '')) + '</code></pre>';
    } else {
      html += escapeHtml(part).replace(/`([^`]+)`/g, '<code>$1</code>');
    }
  });
  return html;
}

function addMessage(role, text) {
  emptyState.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="msg-role">' + (role === 'user' ? 'sen' : 'model') + '</div><div class="msg-body">' + renderBody(text) + '</div>';
  thread.appendChild(div);
  main.scrollTop = main.scrollHeight;
  return div.querySelector('.msg-body');
}

async function send() {
  const text = promptInput.value.trim();
  const model = activeModel;
  if (!text) return;
  if (!connected || !model) {
    setStatus('err', 'bağlantı yok');
    return;
  }
  const server = SERVER;

  addMessage('user', text);
  history.push({ role: 'user', content: text });
  promptInput.value = '';
  promptInput.style.height = 'auto';
  sendBtn.disabled = true;

  const bodyEl = addMessage('assistant', '');
  let full = '';

  try {
    const res = await fetch(server + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, messages: history, stream: true })
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const obj = JSON.parse(line);
          if (obj.message && obj.message.content) {
            full += obj.message.content;
            bodyEl.innerHTML = renderBody(full);
            main.scrollTop = main.scrollHeight;
          }
        } catch (e) { /* skip malformed line */ }
      }
    }
    history.push({ role: 'assistant', content: full });
  } catch (err) {
    bodyEl.innerHTML = renderBody('[hata: ' + err.message + ']');
    setStatus('err', 'istek başarısız');
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', send);
promptInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
promptInput.addEventListener('input', () => {
  promptInput.style.height = 'auto';
  promptInput.style.height = Math.min(promptInput.scrollHeight, 200) + 'px';
});
clearBtn.addEventListener('click', () => {
  history = [];
  thread.innerHTML = '';
  emptyState.style.display = '';
});

// auto-connect on load
connect();
</script>

</body>
</html>
