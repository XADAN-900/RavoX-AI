<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RavoX AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0f12;
    --panel: #12161b;
    --panel-2: #171c22;
    --line: #232a32;
    --text: #dfe6ec;
    --text-dim: #7c8892;
    --amber: #e8a355;
    --amber-dim: #7a5c33;
    --green: #4caf7d;
    --red: #d16b6b;
    --radius: 3px;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }
  body { display: flex; flex-direction: column; }

  header {
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .brand {
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--text);
    white-space: nowrap;
  }
  .brand span { color: var(--amber); }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .status-dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.err { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .status-dot.connecting { background: var(--amber); box-shadow: 0 0 6px var(--amber); animation: pulse 1s ease-in-out infinite; }
  .status-dot.busy { background: var(--amber); box-shadow: 0 0 6px var(--amber); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .status-text { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
  button.ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    margin-left: auto;
  }
  button.ghost:hover { border-color: var(--amber-dim); color: var(--text); }

  main { flex: 1; overflow-y: auto; padding: 28px 0 150px; }
  .thread { max-width: 760px; margin: 0 auto; padding: 0 22px; }
  .msg { margin-bottom: 26px; padding-left: 14px; border-left: 2px solid var(--line); }
  .msg.user { border-left-color: var(--amber-dim); }
  .msg.assistant { border-left-color: var(--green); opacity: 0.97; }
  .msg-role {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: lowercase;
    color: var(--text-dim);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .msg.user .msg-role { color: var(--amber); }
  .msg.assistant .msg-role { color: var(--green); }
  .msg-timer {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
  }
  .msg-body { font-size: 14.5px; line-height: 1.65; white-space: pre-wrap; word-wrap: break-word; }
  .msg-body code { font-family: var(--mono); background: var(--panel-2); padding: 1px 5px; border-radius: 2px; font-size: 0.9em; }
  .msg-body pre { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; overflow-x: auto; }
  .msg-body pre code { background: none; padding: 0; }
  .msg-image { max-width: 260px; border-radius: var(--radius); border: 1px solid var(--line); margin-bottom: 8px; display: block; }
  .msg-file-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: 4px 9px;
    border-radius: var(--radius);
    margin-bottom: 8px;
  }

  /* typing dots */
  .typing-dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  .empty-state {
    max-width: 760px; margin: 60px auto; padding: 0 22px;
    color: var(--text-dim); font-family: var(--mono); font-size: 13px; line-height: 1.8;
  }
  .empty-state .big { font-family: var(--sans); font-weight: 700; font-size: 22px; color: var(--text); margin-bottom: 10px; }

  /* Composer */
  .composer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, transparent, var(--bg) 30%);
    padding: 14px 22px 22px;
  }
  .attach-preview {
    max-width: 760px;
    margin: 0 auto 8px;
    display: none;
    align-items: center;
    gap: 8px;
  }
  .attach-preview.show { display: flex; }
  .attach-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 6px 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }
  .attach-chip img { width: 24px; height: 24px; object-fit: cover; border-radius: 2px; }
  .attach-chip button {
    background: none; border: none; color: var(--red); cursor: pointer; font-size: 13px; padding: 0 2px;
  }
  .composer-inner {
    max-width: 760px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 10px 10px 10px;
  }
  .composer-inner:focus-within { border-color: var(--amber-dim); }
  #attachBtn {
    background: none; border: 1px solid var(--line); color: var(--text-dim);
    font-family: var(--mono); font-size: 15px; width: 34px; height: 34px;
    border-radius: var(--radius); cursor: pointer; flex-shrink: 0;
  }
  #attachBtn:hover { border-color: var(--amber-dim); color: var(--text); }
  #promptInput {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: var(--sans); font-size: 14.5px;
    resize: none; max-height: 200px; line-height: 1.5; padding: 6px 0;
  }
  #sendBtn {
    background: var(--amber); color: #1a1204; border: none;
    font-family: var(--mono); font-weight: 600; font-size: 12.5px;
    padding: 10px 16px; border-radius: var(--radius); cursor: pointer; flex-shrink: 0;
  }
  #sendBtn.stop { background: var(--red); color: #240b0b; }
  #sendBtn:disabled { background: var(--panel-2); color: var(--text-dim); cursor: default; }
  #sendBtn:hover:not(:disabled) { filter: brightness(1.08); }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .icon { width: 15px; height: 15px; display: block; }
  #attachBtn { display: flex; align-items: center; justify-content: center; }
  .file-chip-icon { width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px; }
  .attach-chip button svg { width: 11px; height: 11px; display: block; }
  .attach-chip button { display: flex; align-items: center; justify-content: center; padding: 2px; }
</style>
</head>
<body>

<header>
  <div class="brand">RavoX<span> AI</span></div>
  <div class="status-dot connecting" id="statusDot"></div>
  <div class="status-text" id="statusText">bağlantı kuruluyor</div>
  <button class="ghost" id="clearBtn">temizle</button>
</header>

<main id="main">
  <div class="empty-state" id="emptyState">
    <div class="big">RavoX AI</div>
    Bir şey sor, bir dosya ekle veya görsel yükle.
  </div>
  <div class="thread" id="thread"></div>
</main>

<div class="composer">
  <div class="attach-preview" id="attachPreview"></div>
  <div class="composer-inner">
    <input type="file" id="fileInput" accept="image/*,.txt,.md,.js,.py,.json,.csv,.log,.html,.css" style="display:none">
    <button id="attachBtn" title="Dosya/görsel ekle">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
    </button>
    <textarea id="promptInput" rows="1" placeholder="Bir şey sor..."></textarea>
    <button id="sendBtn">gönder</button>
  </div>
</div>

<script>
const SERVER = 'https://water-soon-ride-year.trycloudflare.com';

const $ = (id) => document.getElementById(id);
const clearBtn = $('clearBtn');
const statusDot = $('statusDot');
const statusText = $('statusText');
const thread = $('thread');
const emptyState = $('emptyState');
const promptInput = $('promptInput');
const sendBtn = $('sendBtn');
const main = $('main');
const attachBtn = $('attachBtn');
const fileInput = $('fileInput');
const attachPreview = $('attachPreview');

let history = [];
let connected = false;
let activeModel = '';
let generating = false;
let abortCtrl = null;
let pendingAttachment = null; // { kind: 'image'|'text', name, data (base64 or text) }

function setStatus(state, text) {
  statusDot.className = 'status-dot' + (state ? ' ' + state : '');
  statusText.textContent = text;
}

async function connect() {
  setStatus('connecting', 'bağlantı kuruluyor');
  try {
    const res = await fetch(SERVER + '/api/tags');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const models = (data.models || []).map(m => m.name);
    if (models.length === 0) {
      connected = false;
      setStatus('err', 'bağlantı kurulamadı');
      return;
    }
    activeModel = models[0];
    connected = true;
    setStatus('ok', 'bağlantı kuruldu');
  } catch (err) {
    connected = false;
    setStatus('err', 'bağlantı kurulamadı');
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function renderBody(text) {
  const parts = text.split(/```/);
  let html = '';
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      html += '<pre><code>' + escapeHtml(part.replace(/^\w*\n/, '')) + '</code></pre>';
    } else {
      html += escapeHtml(part).replace(/`([^`]+)`/g, '<code>$1</code>');
    }
  });
  return html;
}

function fmtDuration(ms) {
  return (ms / 1000).toFixed(1) + 's';
}

function addMessage(role, text, opts) {
  opts = opts || {};
  emptyState.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  let extra = '';
  if (opts.imageDataUrl) extra += '<img class="msg-image" src="' + opts.imageDataUrl + '">';
  if (opts.fileName) extra += '<div class="msg-file-chip">' + ICON_FILE + escapeHtml(opts.fileName) + '</div><br>';
  div.innerHTML =
    '<div class="msg-role">' + (role === 'user' ? 'sen' : 'model') +
    '<span class="msg-timer" id="timer-' + opts.id + '"></span></div>' +
    '<div class="msg-extra">' + extra + '</div>' +
    '<div class="msg-body" id="body-' + opts.id + '">' + (extra ? '' : renderBody(text)) + '</div>';
  thread.appendChild(div);
  main.scrollTop = main.scrollHeight;
  return div;
}

function setSendMode(isGenerating) {
  generating = isGenerating;
  if (isGenerating) {
    sendBtn.textContent = 'durdur';
    sendBtn.classList.add('stop');
    setStatus('busy', activeModel + ' yazıyor...');
  } else {
    sendBtn.textContent = 'gönder';
    sendBtn.classList.remove('stop');
    setStatus('ok', 'bağlantı kuruldu');
  }
}

// --- Attachment handling ---
attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;
  if (file.type.startsWith('image/')) {
    const dataUrl = await new Promise(res => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.readAsDataURL(file);
    });
    pendingAttachment = { kind: 'image', name: file.name, data: dataUrl.split(',')[1], dataUrl };
    attachPreview.innerHTML = '<div class="attach-chip"><img src="' + dataUrl + '">' + escapeHtml(file.name) + '<button id="removeAttach">' + ICON_CLOSE + '</button></div>';
  } else {
    const text = await file.text();
    pendingAttachment = { kind: 'text', name: file.name, data: text };
    attachPreview.innerHTML = '<div class="attach-chip">' + ICON_FILE + escapeHtml(file.name) + '<button id="removeAttach">' + ICON_CLOSE + '</button></div>';
  }
  attachPreview.classList.add('show');
  document.getElementById('removeAttach').addEventListener('click', () => {
    pendingAttachment = null;
    attachPreview.classList.remove('show');
    attachPreview.innerHTML = '';
    fileInput.value = '';
  });
});

let msgCounter = 0;

const ICON_FILE = '<svg class="file-chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>';
const ICON_CLOSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';

async function send() {
  if (generating) {
    if (abortCtrl) abortCtrl.abort();
    return;
  }
  const text = promptInput.value.trim();
  if (!text && !pendingAttachment) return;
  if (!connected || !activeModel) {
    setStatus('err', 'bağlantı kurulamadı');
    return;
  }

  const attachment = pendingAttachment;
  pendingAttachment = null;
  attachPreview.classList.remove('show');
  attachPreview.innerHTML = '';
  fileInput.value = '';

  const userId = ++msgCounter;
  let displayText = text;
  let userMsgContent = text;

  const userDiv = addMessage('user', displayText, {
    id: userId,
    imageDataUrl: attachment && attachment.kind === 'image' ? attachment.dataUrl : null,
    fileName: attachment && attachment.kind === 'text' ? attachment.name : null
  });
  document.getElementById('body-' + userId).innerHTML = renderBody(displayText);

  const userMsg = { role: 'user', content: text || (attachment ? '(ek dosya gönderildi)' : '') };
  if (attachment && attachment.kind === 'image') {
    userMsg.images = [attachment.data];
  } else if (attachment && attachment.kind === 'text') {
    userMsg.content = '[Ek dosya: ' + attachment.name + ']\n\n' + attachment.data + '\n\n---\n\n' + (text || 'Bu dosyayı analiz et.');
  }
  history.push(userMsg);

  promptInput.value = '';
  promptInput.style.height = 'auto';

  const assistId = ++msgCounter;
  const assistDiv = addMessage('assistant', '', { id: assistId });
  const bodyEl = document.getElementById('body-' + assistId);
  const timerEl = document.getElementById('timer-' + assistId);
  bodyEl.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

  let full = '';
  const startTime = Date.now();
  let timerInterval = setInterval(() => {
    timerEl.textContent = fmtDuration(Date.now() - startTime);
  }, 100);

  abortCtrl = new AbortController();
  setSendMode(true);

  try {
    const res = await fetch(SERVER + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: activeModel, messages: history, stream: true }),
      signal: abortCtrl.signal
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let firstToken = true;
    let stats = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const obj = JSON.parse(line);
          if (obj.message && obj.message.content) {
            if (firstToken) { firstToken = false; }
            full += obj.message.content;
            bodyEl.innerHTML = renderBody(full);
            main.scrollTop = main.scrollHeight;
          }
          if (obj.done) stats = obj;
        } catch (e) { /* skip malformed line */ }
      }
    }
    history.push({ role: 'assistant', content: full });

    clearInterval(timerInterval);
    if (stats && stats.eval_count && stats.eval_duration) {
      const totalS = (stats.total_duration / 1e9).toFixed(1);
      const tps = (stats.eval_count / (stats.eval_duration / 1e9)).toFixed(1);
      timerEl.textContent = totalS + 's · ' + tps + ' tok/s';
    } else {
      timerEl.textContent = fmtDuration(Date.now() - startTime);
    }
  } catch (err) {
    clearInterval(timerInterval);
    if (err.name === 'AbortError') {
      timerEl.textContent = fmtDuration(Date.now() - startTime) + ' · durduruldu';
      if (full) history.push({ role: 'assistant', content: full });
    } else {
      bodyEl.innerHTML = renderBody(full + '\n\n[hata: ' + err.message + ']');
      setStatus('err', 'bağlantı kurulamadı');
    }
  } finally {
    abortCtrl = null;
    setSendMode(false);
  }
}

sendBtn.addEventListener('click', send);
promptInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
promptInput.addEventListener('input', () => {
  promptInput.style.height = 'auto';
  promptInput.style.height = Math.min(promptInput.scrollHeight, 200) + 'px';
});
clearBtn.addEventListener('click', () => {
  history = [];
  thread.innerHTML = '';
  emptyState.style.display = '';
});

connect();
</script>

</body>
</html>
